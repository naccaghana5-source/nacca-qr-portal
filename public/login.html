<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - NaCCA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1e2b, #2d7a2d);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
    }
    .login-card {
      background: white;
      border-radius: 32px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo i {
      font-size: 48px;
      color: #2d7a2d;
    }
    .logo h2 {
      color: #1a1e2b;
      margin-top: 10px;
      font-size: 1.5rem;
    }
    .logo p {
      color: #666;
      font-size: 0.85rem;
      margin-top: 5px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 0.85rem;
    }
    .form-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 40px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
    }
    .form-group input:focus {
      outline: none;
      border-color: #2d7a2d;
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: #2d7a2d;
      color: white;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-login:hover {
      background: #1e5a1e;
    }
    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.85rem;
      display: none;
    }
    .message.error {
      background: #fee2e2;
      color: #dc2626;
      display: block;
    }
    .message.success {
      background: #e8f5e9;
      color: #2d7a2d;
      display: block;
    }
    .back-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
    }
    .back-link a {
      color: #2d7a2d;
      text-decoration: none;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <i class="fas fa-shield-alt"></i>
        <h2>Admin Login</h2>
        <p>Enter your credentials to access the dashboard</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label><i class="fas fa-key"></i> Admin Password</label>
          <input type="password" id="password" placeholder="Enter admin password" required>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>

        <div id="message" class="message"></div>
      </form>

      <div class="back-link">
        <a href="/"><i class="fas fa-arrow-left"></i> Back to Portal</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
  
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');
      const loginBtn = document.getElementById('loginBtn');
  
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Verifying...';
  
      try {
        // Call the serverless function
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ password })
        });
  
        const result = await response.json();
  
        if (result.success) {
  localStorage.setItem('nacca_admin_logged_in', 'true');
  sessionStorage.setItem('admin_session', 'active');
  
  // Store user info
  sessionStorage.setItem('user_name', result.user?.name || 'Admin');
  sessionStorage.setItem('user_role', result.user?.role || 'admin');
          
          setTimeout(() => {
            window.location.href = '/admin.html';
          }, 1000);
        } else {
          messageDiv.className = 'message error';
          messageDiv.innerHTML = '❌ ' + (result.error || 'Incorrect password.');
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
        }
      } catch (error) {
        messageDiv.className = 'message error';
        messageDiv.innerHTML = '❌ Connection error. Please try again.';
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
      }
    });
  </script>
</body>
</html>
