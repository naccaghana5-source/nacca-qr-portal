<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - NaCCA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1e2b, #2d7a2d);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .card {
      background: white;
      border-radius: 32px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo i { font-size: 48px; color: #2d7a2d; }
    .logo h2 { color: #1a1e2b; margin-top: 10px; font-size: 1.5rem; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 0.85rem;
    }
    .form-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 40px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
    }
    .form-group input:focus {
      outline: none;
      border-color: #2d7a2d;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #2d7a2d;
      color: white;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn:hover { background: #1e5a1e; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.85rem;
      display: none;
    }
    .message.error { background: #fee2e2; color: #dc2626; display: block; }
    .message.success { background: #e8f5e9; color: #2d7a2d; display: block; }
    .back-link { text-align: center; margin-top: 20px; font-size: 0.85rem; }
    .back-link a { color: #2d7a2d; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <i class="fas fa-key"></i>
        <h2>Change Password</h2>
        <p style="color:#666; font-size:0.85rem; margin-top:5px;">Update your admin password</p>
      </div>

      <form id="passwordForm">
        <div class="form-group">
          <label>Current Password</label>
          <input type="password" id="currentPassword" required>
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="newPassword" required minlength="4">
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" id="confirmPassword" required>
        </div>
        <button type="submit" class="btn" id="submitBtn">Update Password</button>
        <div id="message" class="message"></div>
      </form>

      <div class="back-link">
        <a href="/admin.html"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
      </div>
    </div>
  </div>

  <script>
    // This is a client-side password change (for demo)
    // In production, use server-side API
    const CURRENT_PASSWORD = window.__ENV?.NEXT_PUBLIC_ADMIN_PASSWORD || 'NaCCA2025Secure!';

    document.getElementById('passwordForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const current = document.getElementById('currentPassword').value;
      const newPass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const messageDiv = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');

      if (current !== CURRENT_PASSWORD) {
        messageDiv.className = 'message error';
        messageDiv.innerHTML = '❌ Current password is incorrect.';
        return;
      }

      if (newPass !== confirm) {
        messageDiv.className = 'message error';
        messageDiv.innerHTML = '❌ Passwords do not match.';
        return;
      }

      if (newPass.length < 4) {
        messageDiv.className = 'message error';
        messageDiv.innerHTML = '❌ Password must be at least 4 characters.';
        return;
      }

      // In production, this would call an API
      // For demo, store in localStorage
      localStorage.setItem('nacca_admin_password', newPass);
      messageDiv.className = 'message success';
      messageDiv.innerHTML = '✅ Password updated successfully! Please login again.';

      setTimeout(() => {
        window.location.href = '/login.html';
      }, 2000);
    });
  </script>
</body>
</html>
