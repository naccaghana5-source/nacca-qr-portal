<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - NaCCA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fc;
      padding: 20px;
    }
    .dashboard-container { max-width: 1400px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, #1a1e2b, #2d7a2d);
      color: white;
      padding: 20px 30px;
      border-radius: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 30px;
    }
    .header h1 { font-size: 1.5rem; }
    .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .logout-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
    }
    .logout-btn:hover { background: #b91c1c; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .kpi-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .kpi-value { font-size: 2.5rem; font-weight: 800; color: #2d7a2d; }
    .kpi-label { font-size: 0.75rem; color: #888; text-transform: uppercase; margin-top: 5px; }
    .admin-section {
      background: white;
      border-radius: 24px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .admin-section h2 {
      color: #1a1e2b;
      margin-bottom: 20px;
      border-bottom: 2px solid #eef2f0;
      padding-bottom: 10px;
    }
    .btn-primary {
      background: #2d7a2d;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary:hover { background: #1e5a1e; }
    .btn-secondary {
      background: #F5A524;
      color: #1a1e2b;
      border: none;
      padding: 10px 24px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-secondary:hover { background: #e09414; }
    .btn-danger {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-danger:hover { background: #b91c1c; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #eef2f0;
    }
    th { background: #f8f9fa; font-weight: 600; color: #1a1e2b; }
    tr:hover { background: #f8f9fa; }
    .access-denied {
      text-align: center;
      padding: 80px 20px;
    }
    .access-denied h1 { color: #dc2626; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="dashboard-container" id="app">
    <!-- Header -->
    <div class="header">
      <h1><i class="fas fa-shield-alt"></i> Admin Dashboard</h1>
      <div class="header-actions">
        <span id="adminUser" style="font-size:0.85rem; opacity:0.8;">Admin</span>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-value" id="kpiTotal">0</div><div class="kpi-label">Total Approved</div></div>
      <div class="kpi-card"><div class="kpi-value" id="kpiTextbooks">0</div><div class="kpi-label">Textbooks</div></div>
      <div class="kpi-card"><div class="kpi-value" id="kpiSupplementary">0</div><div class="kpi-label">Supplementary</div></div>
      <div class="kpi-card"><div class="kpi-value" id="kpiPublishers">0</div><div class="kpi-label">Publishers</div></div>
    </div>

    <!-- Admin Actions -->
    <div class="admin-section">
      <h2><i class="fas fa-tools"></i> Admin Actions</h2>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn-primary" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
        <button class="btn-secondary" onclick="exportCSV()"><i class="fas fa-file-csv"></i> Export CSV</button>
        <button class="btn-primary" onclick="openBatchQR()"><i class="fas fa-qrcode"></i> Batch QR</button>
        <button class="btn-secondary" onclick="changePassword()"><i class="fas fa-key"></i> Change Password</button>
      </div>
    </div>

    <!-- Books Table -->
    <div class="admin-section">
      <h2><i class="fas fa-book"></i> Book Management</h2>
      <div style="overflow-x: auto;">
        <table id="booksTable">
          <thead>
            <tr>
              <th>Book ID</th>
              <th>Title</th>
              <th>Subject</th>
              <th>Category</th>
              <th>Publisher</th>
              <th>Approved Year</th>
            </tr>
          </thead>
          <tbody id="booksTableBody">
            <tr><td colspan="6" style="text-align:center; padding:40px;">Loading books...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // ADMIN DASHBOARD - PROTECTED PAGE
    // ============================================

    // Check if user is logged in
    function checkAuth() {
      const isLoggedIn = localStorage.getItem('nacca_admin_logged_in') === 'true' &&
                         sessionStorage.getItem('admin_session') === 'active';

      if (!isLoggedIn) {
        window.location.href = '/login.html';
        return false;
      }
      return true;
    }

    // Logout function
    function logout() {
      localStorage.setItem('nacca_admin_logged_in', 'false');
      sessionStorage.removeItem('admin_session');
      window.location.href = '/login.html';
    }

    // Load data from CSV (same as main portal)
    const CSV_FILE_URL = `/Books.csv?v=${Date.now()}`;

    async function loadData() {
      try {
        const response = await fetch(CSV_FILE_URL);
        if (!response.ok) throw new Error('CSV not found');
        const csvText = await response.text();
        const rows = csvText.split(/\r?\n/).filter(r => r.trim());
        if (rows.length < 2) throw new Error('No data');

        const headers = parseCSVRow(rows[0]);
        const idx = {
          stableId: headers.findIndex(h => h?.toLowerCase().includes('stable')),
          bookId: headers.findIndex(h => h?.toLowerCase().includes('book id') || h?.toLowerCase().includes('bookid')),
          title: headers.findIndex(h => h?.toLowerCase().includes('title')),
          subject: headers.findIndex(h => h?.toLowerCase().includes('subject')),
          category: headers.findIndex(h => h?.toLowerCase().includes('category')),
          grade: headers.findIndex(h => h?.toLowerCase().includes('grade')),
          publisher: headers.findIndex(h => h?.toLowerCase().includes('publisher') || h?.toLowerCase().includes('author')),
          copyright: headers.findIndex(h => h?.toLowerCase().includes('copyright')),
          approved: headers.findIndex(h => h?.toLowerCase().includes('approved')),
          cover: headers.findIndex(h => h?.toLowerCase().includes('cover'))
        };

        const books = [];
        for (let i = 1; i < rows.length; i++) {
          const vals = parseCSVRow(rows[i]);
          if (!vals.length) continue;
          books.push({
            bookId: (idx.bookId >= 0 && vals[idx.bookId]) ? vals[idx.bookId].trim() : 'N/A',
            title: (idx.title >= 0 && vals[idx.title]) ? vals[idx.title].trim() : 'Untitled',
            subject: (idx.subject >= 0 && vals[idx.subject]) ? vals[idx.subject].trim() : 'General',
            category: (idx.category >= 0 && vals[idx.category]) ? vals[idx.category].trim() : 'Textbook',
            publisher: (idx.publisher >= 0 && vals[idx.publisher]) ? vals[idx.publisher].trim() : 'Unknown',
            approvedYear: (idx.approved >= 0 && vals[idx.approved]) ? vals[idx.approved].trim() : '2026',
          });
        }

        updateKPIs(books);
        updateTable(books);
        return books;
      } catch (e) {
        console.error('Error loading data:', e);
        document.getElementById('booksTableBody').innerHTML =
          `<tr><td colspan="6" style="text-align:center; padding:40px; color:#dc2626;">❌ Failed to load data</td></tr>`;
      }
    }

    function parseCSVRow(row) {
      const result = [];
      let inQuotes = false, current = '';
      for (let c of row) {
        if (c === '"') inQuotes = !inQuotes;
        else if (c === ',' && !inQuotes) { result.push(current); current = ''; }
        else current += c;
      }
      result.push(current);
      return result.map(c => c.trim().replace(/^"(.*)"$/, '$1'));
    }

    function updateKPIs(books) {
      document.getElementById('kpiTotal').innerText = books.length;
      document.getElementById('kpiTextbooks').innerText = books.filter(b => b.category === 'Textbook').length;
      document.getElementById('kpiSupplementary').innerText = books.filter(b => b.category === 'Supplementary').length;
      document.getElementById('kpiPublishers').innerText = new Set(books.map(b => b.publisher)).size;
    }

    function updateTable(books) {
      const tbody = document.getElementById('booksTableBody');
      if (!books.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:40px;">No books found</td></tr>`;
        return;
      }
      tbody.innerHTML = books.map(b => `
        <tr>
          <td><strong>${escapeHtml(b.bookId)}</strong></td>
          <td>${escapeHtml(b.title)}</td>
          <td>${escapeHtml(b.subject)}</td>
          <td><span class="badge" style="background:#eef5ec; padding:2px 10px; border-radius:20px;">${escapeHtml(b.category)}</span></td>
          <td>${escapeHtml(b.publisher)}</td>
          <td>${escapeHtml(b.approvedYear)}</td>
        </tr>
      `).join('');
    }

    function escapeHtml(s) {
      if (!s) return '';
      return s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    // Admin functions
    function refreshData() {
      alert('🔄 Refreshing data...');
      loadData();
    }

    function exportCSV() {
      alert('📤 Export CSV feature coming soon');
    }

    function openBatchQR() {
      alert('📱 Batch QR generation coming soon');
    }

    function changePassword() {
      window.location.href = '/change-password.html';
    }

    // Initialize
    if (checkAuth()) {
      loadData();
    }
  </script>
</body>
</html>
